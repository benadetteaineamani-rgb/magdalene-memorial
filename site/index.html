/* Vespers: a night sky warming to heavenly light; a rosary embraces her portrait; parchment panels framed in gold. */
:root{
  --night:#16061b; --plum:#3b1244; --amethyst:#8b4f9e; --lilac:#d9c2e3;
  --gold:#d6ae58; --gold-hi:#f7e4a8; --ivory:#fbf5ea; --ink:#2a1530; --muted:#7a6380;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --script:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
  --caps:"Cinzel","Trajan Pro",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night)}
body{font-family:var(--display);color:var(--ivory);font-size:19px;line-height:1.6;overflow-x:hidden;min-height:100%;
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(247,228,168,.28) 0%,rgba(190,120,170,.18) 22%,transparent 55%),
    linear-gradient(180deg,#5a2464 0%,#3b1244 22%,#260a2e 55%,var(--night) 100%);
  background-attachment:fixed}
h1,h2,h3{text-wrap:balance;font-weight:500}
img{max-width:100%}

/* heavenly rays */
.rays{position:fixed;left:50%;top:-40vh;width:180vmax;height:180vmax;transform:translateX(-50%);pointer-events:none;z-index:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,240,200,.07) 0deg 4deg,transparent 4deg 13deg);
  -webkit-mask:radial-gradient(circle at 50% 50%,#000 0%,rgba(0,0,0,.6) 18%,transparent 42%);
          mask:radial-gradient(circle at 50% 50%,#000 0%,rgba(0,0,0,.6) 18%,transparent 42%);
  animation:spin 140s linear infinite}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

.wrap{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:0 18px}

/* hero */
.hero{position:relative;text-align:center;padding-top:44px}
#rosary{position:absolute;left:50%;top:0;transform:translateX(-50%);width:100vw;max-width:900px;height:100%;pointer-events:none;z-index:0}
.hero>*{position:relative;z-index:1}
.eyebrow{font-family:var(--caps);font-size:13px;letter-spacing:.42em;color:var(--gold-hi);text-transform:uppercase;padding-left:.42em}
.eyebrow-rule{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.eyebrow-rule i{height:1px;width:46px;background:linear-gradient(90deg,transparent,var(--gold))}
.eyebrow-rule i:last-child{transform:scaleX(-1)}
.lead{font-family:var(--script);white-space:nowrap;font-size:clamp(36px,10.6vw,74px);line-height:1.05;color:#fff;
  text-shadow:0 0 22px rgba(247,228,168,.55),0 2px 0 rgba(0,0,0,.15)}
.loop{padding:96px 0 84px;margin-top:20px}
.portrait{position:relative;width:min(232px,60vw);aspect-ratio:3/4;margin:0 auto}
.portrait::before{content:"";position:absolute;inset:-34px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(247,228,168,.55),rgba(247,228,168,.12) 60%,transparent 100%);filter:blur(2px)}
.frame{position:relative;width:100%;height:100%;border-radius:50%;padding:9px;
  background:conic-gradient(from 210deg,#fff2c4,#b9842a,#f7e4a8,#8f5f17,#f9e7b0,#b9842a,#fff2c4);
  box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,240,200,.6)}
.frame::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(90,50,10,.45);pointer-events:none}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 26%;border-radius:50%;display:block;border:3px solid var(--ivory)}
.mrs{margin-top:30px;font-family:var(--caps);font-size:15px;letter-spacing:.5em;padding-left:.5em;color:var(--gold-hi)}
.given{font-size:clamp(32px,8.4vw,48px);font-weight:600;line-height:1.08;color:var(--ivory);letter-spacing:.01em;margin-top:2px}
.surname{font-family:var(--script);font-size:clamp(60px,16vw,98px);line-height:1.02;margin-top:-2px;
  background:linear-gradient(180deg,#fff6d6 10%,#f0cf7c 45%,#b98a2c 75%,#f7e4a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.4))}
.dates{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:6px;font-family:var(--caps);font-size:19px;letter-spacing:.14em;color:var(--ivory);font-variant-numeric:lining-nums}
.dates svg{width:18px;height:18px}
.pendant{height:360px}
.roles{max-width:560px;margin:0 auto;padding-top:6px}
.roles .line{font-family:var(--caps);font-size:clamp(13px,3.4vw,15px);letter-spacing:.22em;color:var(--gold-hi);line-height:2.1;text-transform:uppercase}
.roles .line span{white-space:nowrap}
.roles .line b{font-weight:500;color:var(--gold);padding:0 .45em}
.roles .faith{font-style:italic;font-size:clamp(21px,5.2vw,26px);color:var(--lilac);margin-top:6px}

/* ornament divider */
.orn{display:block;margin:54px auto;width:240px;height:28px;opacity:.95}

/* stoic quote */
.stoic{text-align:center;max-width:680px;margin:0 auto;padding:0 6px}
.stoic .label{font-family:var(--caps);font-size:12px;letter-spacing:.4em;color:var(--gold);margin-bottom:64px;padding-left:.4em}
.stoic blockquote{font-style:italic;font-weight:400;font-size:clamp(27px,6.6vw,40px);line-height:1.32;color:#fffaf0;position:relative}
.stoic blockquote::before{content:"\201C";font-family:var(--script);position:absolute;left:50%;top:-.62em;transform:translateX(-50%);font-size:2.6em;line-height:1;color:var(--gold);opacity:.55}
.stoic .who{margin-top:22px;font-family:var(--caps);letter-spacing:.3em;font-size:15px;color:var(--gold-hi)}
.stoic .src{font-size:16px;color:var(--lilac);font-style:italic;margin-top:4px}

/* parchment panel */
.panel{position:relative;color:var(--ink);border-radius:6px;padding:46px 30px 38px;
  background:
    radial-gradient(120% 90% at 50% 0%,#fffdf7 0%,#fbf3e3 55%,#f2e4cc 100%);
  box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(214,174,88,.9),0 0 0 7px rgba(251,245,234,.06),0 0 0 8px rgba(214,174,88,.45)}
.panel::before{content:"";position:absolute;inset:10px;border:1px solid rgba(185,132,42,.55);border-radius:3px;pointer-events:none}
.panel .corner{position:absolute;width:44px;height:44px;pointer-events:none}
.panel .c1{top:4px;left:4px}.panel .c2{top:4px;right:4px;transform:scaleX(-1)}
.panel .c3{bottom:4px;left:4px;transform:scaleY(-1)}.panel .c4{bottom:4px;right:4px;transform:scale(-1,-1)}
.ptitle{text-align:center;font-family:var(--script);font-size:clamp(40px,9vw,52px);line-height:1;color:var(--plum)}

/* scripture carousel */
.scripture{min-height:330px;display:grid;grid-template-rows:auto auto 1fr auto}
.slides{position:relative;display:grid}
.slide{grid-area:1/1;text-align:center;opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform .9s ease;visibility:hidden;max-width:560px;margin:0 auto}
.slide.on{opacity:1;transform:none;visibility:visible}
.slide p{font-style:italic;font-size:clamp(22px,5.4vw,28px);line-height:1.42;color:#3a1a42}
.slide cite{display:block;margin-top:14px;font-style:normal;font-family:var(--caps);letter-spacing:.24em;font-size:14px;color:#8b5a9a}
.dots{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:22px}
.dots button{width:10px;height:10px;border-radius:50%;border:1px solid #b9842a;background:transparent;cursor:pointer;padding:0;transition:all .3s}
.dots button.on{background:#b9842a;transform:scale(1.25)}
.dots .nav{width:auto;height:auto;border:none;font-family:var(--caps);font-size:18px;color:#8b5a9a;padding:2px 8px;border-radius:0}
.kjv{text-align:center;font-size:14px;color:var(--muted);margin-top:14px;font-style:italic}

/* prayer arch */
.prayer{max-width:600px;margin:0 auto;text-align:center;padding:64px 34px 46px;border-radius:300px 300px 8px 8px}
.prayer::before{border-radius:290px 290px 4px 4px}
.prayer .cand{margin:-8px auto 6px;width:26px;height:58px}
.prayer p{font-size:clamp(20px,4.8vw,22px);line-height:1.62;color:#3a2440}
.prayer .amen{font-family:var(--script);font-size:38px;color:var(--plum);margin-top:8px;line-height:1}

.grid2{display:grid;gap:34px}

/* messages */
.wallhead{text-align:center;margin-top:8px}
.wallhead h2{font-family:var(--script);font-weight:400;font-size:clamp(54px,13vw,78px);line-height:1.05;color:#fff;text-shadow:0 0 24px rgba(247,228,168,.5)}
.wallhead p{font-family:var(--caps);font-size:12.5px;letter-spacing:.32em;color:var(--gold-hi);margin-top:6px;padding-left:.32em}
.wall{display:grid;gap:44px 24px;margin-top:52px;align-items:start}
@media(min-width:720px){.wall{grid-template-columns:1fr 1fr}.wall .empty{grid-column:1/-1}}
.msg{position:relative;color:var(--ink);padding:38px 24px 22px;border-radius:6px;text-align:center;
  background:radial-gradient(130% 100% at 50% 0%,#fffdf8,#f7ecd9);box-shadow:0 18px 40px rgba(0,0,0,.4),0 0 0 1px rgba(214,174,88,.85)}
.msg::before{content:"";position:absolute;inset:7px;border:1px solid rgba(185,132,42,.4);border-radius:3px;pointer-events:none}
.msg .cand{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:22px;height:50px}
.msg .text{font-size:20px;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere;color:#2f1a35;font-style:italic}
.msg .sig{margin-top:14px;font-family:var(--script);font-size:32px;line-height:1.1;color:var(--plum)}
.msg .rel{font-family:var(--caps);font-size:11.5px;letter-spacing:.26em;color:#a07a2c;margin-top:4px;text-transform:uppercase}
.msg .when{font-family:var(--caps);font-size:11.5px;letter-spacing:.14em;color:#8d7792;margin-top:8px;padding-top:8px;border-top:1px solid rgba(185,132,42,.25)}
.msg .del{position:absolute;top:12px;right:12px;border:1px solid rgba(139,79,158,.35);background:#fff;color:var(--plum);border-radius:999px;font:600 13px var(--display);padding:3px 11px;cursor:pointer}
.empty{text-align:center;padding:46px 20px 30px;color:var(--lilac);font-style:italic;font-size:20px}
.empty .cand{width:30px;height:66px;margin:0 auto 14px;display:block}

/* candle */
.flame{transform-origin:50% 100%;animation:flick 2.6s ease-in-out infinite}
.halo{animation:breathe 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.94,1.06) skewX(2deg)}50%{transform:scale(1.04,.95) skewX(-2deg)}75%{transform:scale(.97,1.04) skewX(1deg)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.85}}

/* dashboard */
.dash{margin-top:40px;scroll-margin-top:18px}

.field{display:grid;gap:4px;margin-top:14px}
.field label{font-family:var(--caps);font-size:12px;letter-spacing:.24em;color:#8b5a9a;text-transform:uppercase}
.row{display:grid;gap:0 16px}
@media(min-width:560px){.row{grid-template-columns:1fr 1fr}}
input,textarea{width:100%;font:inherit;font-size:19px;padding:11px 14px;border-radius:4px;border:1px solid #d5bf96;background:#fffdf8;color:var(--ink)}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.counter{font-size:14px;color:var(--muted);text-align:right}
.actions{text-align:center}
.btn{margin-top:18px;border:none;cursor:pointer;color:#fff;font-family:var(--caps);font-size:14px;letter-spacing:.24em;padding:15px 30px;border-radius:999px;
  background:linear-gradient(180deg,#9a5bab,#5b1f66);box-shadow:0 0 0 1px #d6ae58,0 0 0 4px rgba(214,174,88,.25),0 10px 22px rgba(59,18,68,.45)}

.status{text-align:center;margin-top:12px;font-size:17px;color:#6b3a7a;min-height:1.5em}

/* garden of remembrance */
[hidden]{display:none!important}
.garden-sec .wallhead{margin-top:0}
.garden{position:relative;height:360px;margin:30px auto 0;border-radius:200px 200px 26px 26px;overflow:hidden;
  background:radial-gradient(80% 60% at 70% 18%,rgba(247,228,168,.22),transparent 60%),linear-gradient(180deg,#2a0d33 0%,#1e0a26 60%,#160620 100%);

.moon{position:absolute;right:16%;top:34px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fffaf0,#f3dfa8 60%,#d6ae58);box-shadow:0 0 40px 12px rgba(247,228,168,.35)}
.hill{position:absolute;left:-15%;right:-15%;bottom:-120px;height:250px;border-radius:50% 50% 0 0;
  background:radial-gradient(ellipse at 50% 0%,#3f6331 0%,#26411f 40%,#132510 100%);box-shadow:0 -4px 24px rgba(150,210,120,.18)}
.hill.back{bottom:-60px;left:-40%;right:10%;height:230px;background:radial-gradient(ellipse at 50% 0%,#2e4a26,#1a3015 70%);opacity:.85}
.beds{position:absolute;inset:0}
.fl{position:absolute;border:none;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fl .sw{display:block;transform-origin:50% 100%;animation:sway var(--sd,4s) ease-in-out var(--dl,0s) infinite alternate}
.fl svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 5px rgba(255,240,210,.22))}
.fl.sel svg{filter:drop-shadow(0 0 9px rgba(255,236,170,1)) drop-shadow(0 0 2px #fff)}
.fl.new .sw{animation:grow 1.8s cubic-bezier(.2,.8,.2,1) both,sway var(--sd,4s) ease-in-out 1.8s infinite alternate}
@keyframes sway{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
@keyframes grow{from{transform:scale(.2,0);opacity:0}to{transform:none;opacity:1}}
.gempty{position:absolute;left:0;right:0;top:40%;text-align:center;color:var(--lilac);font-style:italic;font-size:21px;padding:0 24px}
.ftip{min-height:3.2em;text-align:center;margin:16px auto 0;max-width:560px;color:var(--ivory);font-size:20px;line-height:1.4}
.ftip b{color:var(--gold-hi);font-weight:600}

.fdel{display:inline-block;margin-top:8px;border:1px solid rgba(217,194,227,.5);background:transparent;color:var(--lilac);border-radius:999px;padding:4px 14px;font:600 15px var(--display);cursor:pointer}
.composer{margin-top:28px}
.cgrid{display:grid;gap:22px;align-items:center}
@media(min-width:640px){.cgrid{grid-template-columns:210px 1fr}}
.preview{width:180px;margin:0 auto;padding:16px 18px 0;border-radius:90px 90px 14px 14px;
  background:radial-gradient(circle at 50% 30%,#4a1a55,#1d0822 80%);box-shadow:inset 0 0 0 1px rgba(214,174,88,.7),0 10px 24px rgba(59,18,68,.35)}
.preview svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 8px rgba(255,240,210,.35))}
.flabel{font-family:var(--caps);font-size:12px;letter-spacing:.24em;color:#8b5a9a;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 17px var(--display);padding:6px 15px;border-radius:999px;border:1px solid #d5bf96;background:#fffdf8;color:var(--plum);cursor:pointer}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#9a5bab,#5b1f66);color:#fff;border-color:#5b1f66}

.media{margin-top:16px;display:grid;gap:10px;text-align:left}

.mgrid.n1{grid-template-columns:1fr}.mgrid.n3{grid-template-columns:repeat(3,1fr)}
.thumb{border:none;padding:0;cursor:zoom-in;border-radius:4px;overflow:hidden;aspect-ratio:1;background:#eadfcd;box-shadow:0 0 0 1px rgba(185,132,42,.4)}

.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.voice{background:linear-gradient(180deg,#f7eefa,#efe2f4);border:1px solid rgba(139,79,158,.3);border-radius:999px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:10px}
.vlabel{font-family:var(--caps);font-size:11px;letter-spacing:.2em;color:#8b5a9a;white-space:nowrap}
.voice audio{flex:1;min-width:0;height:38px}
.mvideo{width:100%;border-radius:4px;background:#000;max-height:440px;box-shadow:0 0 0 1px rgba(185,132,42,.5)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(18,4,22,.93);display:none;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 0 0 1px var(--gold),0 20px 60px rgba(0,0,0,.6)}
.lbx{position:absolute;top:16px;right:16px;font-family:var(--caps);letter-spacing:.2em;font-size:12px;background:transparent;color:var(--gold-hi);border:1px solid rgba(214,174,88,.6);border-radius:999px;padding:8px 16px;cursor:pointer}
@media(min-width:700px){.garden{height:440px}}
/* dashboard attachments */
.attach{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

.abtn:disabled{opacity:.5}
.recorder{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:10px;padding:8px 14px;border-radius:999px;background:#fbe9ee;color:#7a1f35;font-weight:600}
.rdot{width:11px;height:11px;border-radius:50%;background:#d0283f;animation:breathe 1s ease-in-out infinite}
.recorder button{border:1px solid rgba(122,31,53,.35);background:#fff;color:#7a1f35;border-radius:999px;padding:3px 12px;font:600 15px var(--display);cursor:pointer}
.alist{display:grid;gap:8px;margin-top:10px}

.achip img,.aicon{width:46px;height:46px;border-radius:6px;flex:none}

.aicon{background:#efe3f3;display:grid;place-items:center;color:var(--plum);font-size:20px}
.aname{flex:1;min-width:0;font-size:16px;color:var(--ink)}

.mbook{display:inline-flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 30px;padding:17px 30px;border-radius:999px;max-width:100%;

  background:linear-gradient(180deg,#fff4cc 0%,#efcf7c 45%,#c39234 100%);
  box-shadow:0 0 0 1px #fff2c4,0 0 0 6px rgba(247,228,168,.22),0 0 34px rgba(247,228,168,.5),0 12px 26px rgba(0,0,0,.45);animation:mglow 3.2s ease-in-out infinite}

.flink{border:none;background:none;color:#8b5a9a;font:600 16px var(--display);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 8px}

.qbtns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

.qempty{font-style:italic;color:var(--muted);text-align:center}
.anchor{display:block;position:relative;top:-18px}

.modes{display:flex;justify-content:center;gap:0;margin:0 auto 20px;border:1px solid #c9a65a;border-radius:999px;padding:3px;width:max-content;max-width:100%;background:#fffdf8}
.mode{border:none;background:transparent;border-radius:999px;padding:9px 18px;font:600 17px var(--display);color:var(--plum);cursor:pointer}

.preview.wide{width:220px;padding:14px 12px 0;border-radius:110px 110px 14px 14px}
.hint{font-size:15px;color:var(--muted);font-style:italic;margin:0}

.favs{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-family:var(--caps);font-size:12px;letter-spacing:.22em;color:var(--gold-hi);text-transform:uppercase}
.fdot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,240,200,.7),0 0 10px rgba(255,255,255,.25)}

footer{position:relative;z-index:2;text-align:center;padding:70px 18px 54px}

    <a class="mbook" href="#memory-book"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5c-6 .5-11 5-13 11l-2 5 1 1 5-2c6-2 10.5-7 11-13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 16.5l5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Write in the Memory Book</span></a>

  function links(c,pts){

      pick.appendChild(dot);pick.appendChild(el('span',null,stemName(s)));pick.onclick=function(){active=i;drawComposer();};b.appendChild(pick);
      if(bunch.length>2){var x=el('button','stemx','×');x.type='button';x.setAttribute('aria-label','Remove flower '+(i+1));
        x.onclick=function(){bunch.splice(i,1);if(active>=bunch.length)active=bunch.length-1;drawComposer();};b.appendChild(x);}
      L.appendChild(b);});
    $('bunchN').textContent='('+bunch.length+' of 9)';
    $('addStem').disabled=bunch.length>=9;
  }
  TYPES.forEach(function(t){var b=el('button','chip',t[1]);b.type='button';b.dataset.k=t[0];b.onclick=function(){curStem().type=t[0];drawComposer();};$('fTypes').appendChild(b);});
  COLORS.forEach(function(c){var b=el('button','swb');b.type='button';b.dataset.k=c[0];b.title=c[1];b.setAttribute('aria-label',c[1]);
    b.style.background='radial-gradient(circle at 35% 30%,#fff,'+c[2]+' 45%,'+c[3]+')';if(FAV.indexOf(c[0])>=0){b.classList.add('fav');b.title=c[1]+', one of her favourite colours';b.setAttribute('aria-label',c[1]+', one of her favourite colours');}b.onclick=function(){curStem().color=c[0];drawComposer();};$('fColors').appendChild(b);});
  WRAPS.forEach(function(w){var b=el('button','swb wrapb');b.type='button';b.dataset.k=w[0];b.title=w[1]+' wrapping';b.setAttribute('aria-label',w[1]+' wrapping');
    b.style.background='linear-gradient(135deg,'+w[2]+','+w[3]+')';b.onclick=function(){wrapSel=w[0];drawComposer();};$('fWraps').appendChild(b);});
  [].forEach.call($('fModes').children,function(b){b.onclick=function(){
    mode=b.dataset.m;
    if(mode==='bunch'&&!bunch.length){bunch=[{type:sel.type,color:sel.color},{type:'lily',color:'blue'},{type:'orchid',color:'green'},{type:'tulip',color:'pink'},{type:'daisy',color:'blue'},{type:'lavender',color:'green'}];active=0;wrapSel='sage';}
    drawComposer();};});
  $('addStem').addEventListener('click',function(){if(bunch.length>=9)return;var c=bunch[active]||sel;var nextT=TYPES[(TYPES.map(function(t){return t[0];}).indexOf(c.type)+1)%TYPES.length][0];
    bunch.push({type:nextT,color:c.color});active=bunch.length-1;drawComposer();});
  drawComposer();
  $('openFlower').addEventListener('click',function(){var c=$('composer');c.hidden=!c.hidden;
    if(!c.hidden){c.scrollIntoView({behavior:'smooth',block:'start'});}});
  $('placeBtn').addEventListener('click',function(){
    var name=$('flName').value.trim(),note=$('flNote').value.trim();
    if(!name){setStatus('Please add your name so the family knows who placed it.',true,'fStatus');$('flName').focus();return;}
    var b=$('placeBtn');b.disabled=true;setStatus(mode==='bunch'?'Placing your bunch of flowers…':'Placing your flower…',false,'fStatus');
    var payload=mode==='bunch'?{stems:bunch,wrap:wrapSel,name:name,note:note}:{type:sel.type,color:sel.color,name:name,note:note};
    req(FAPI,{method:'POST',json:payload}).then(function(d){
      flowers=d.flowers;fLoaded=true;drawGarden(d.id);$('flNote').value='';
      setStatus(mode==='bunch'?'Thank you. Your bunch of flowers now rests in her garden.':'Thank you. Your flower now rests in her garden.',false,'fStatus');
      setTimeout(function(){$('composer').hidden=true;$('garden').scrollIntoView({behavior:'smooth',block:'center'});},1400);
    }).catch(function(e){setStatus(explain(e),true,'fStatus');}).finally(function(){b.disabled=false;});
  });

  function route(){isDash=location.hash==='#dashboard'||location.hash==='#memory-book';document.body.classList.toggle('is-dash',isDash);render();
    if(selFlower){var s=document.querySelector('.fl.sel');if(s)showTip(selFlower,s);}
    if(isDash){$('dashCard').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(function(){try{$('fName').focus({preventScroll:true});}catch(e){}},700);}}
  window.addEventListener('hashchange',route);route();
  var gr;window.addEventListener('resize',function(){clearTimeout(gr);gr=setTimeout(function(){if(fLoaded)drawGarden();},200);});
  function setToday(){try{var t=$('todayDate'),d=new Date();t.textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});t.setAttribute('datetime',d.toISOString().slice(0,10));}catch(e){}}
  setToday();setInterval(setToday,60000);
  loadMessages();loadFlowers();
  if(pwEl.value)signIn(true);
})();
</script>
</body>
</html>
